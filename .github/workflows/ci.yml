name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # 1. Qualité du code (format + analyze)
  # ─────────────────────────────────────────────────────────────────────
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable          # Dart 3.9+ requis par les dépendances
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: |
          dart format . --line-length 100
          git diff --exit-code -- . ':!lib/l10n/' ':!pubspec.lock'

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Create .env for analyze
        run: cp .env.example .env

      - name: Analyze (fatal warnings)
        run: flutter analyze --fatal-warnings

  # ─────────────────────────────────────────────────────────────────────
  # 2. Tests unitaires + widget tests + couverture
  # ─────────────────────────────────────────────────────────────────────
  tests:
    name: Tests (unit + widget)
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Create .env for tests
        run: cp .env.example .env

      - name: Run tests with coverage
        run: flutter test --coverage --reporter=github

      - name: Vérifier le seuil de couverture (≥ 60 %)
        run: python3 scripts/check_coverage.py

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false

  # ─────────────────────────────────────────────────────────────────────
  # 3. Build Android (vérification que ça compile)
  # ─────────────────────────────────────────────────────────────────────
  build-android:
    name: Build Android (debug)
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Create .env file
        run: cp .env.example .env

      - name: Build APK (debug)
        run: flutter build apk --debug --dart-define=APP_ENV=development

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────
  # 4. Build iOS (vérification que ça compile — macOS only)
  # ─────────────────────────────────────────────────────────────────────
  build-ios:
    name: Build iOS (debug)
    runs-on: macos-latest
    needs: tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Create .env file
        run: cp .env.example .env

      - name: Build iOS (no codesign)
        run: |
          flutter create --platforms=ios .
          flutter pub get
          flutter build ios --debug --no-codesign --dart-define=APP_ENV=development
